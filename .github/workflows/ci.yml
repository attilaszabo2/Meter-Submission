name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check Apps Script files
        run: for f in apps-script/*.js; do node --check "$f"; done

      - name: Validate Apps Script manifest
        run: node -e "JSON.parse(require('fs').readFileSync('apps-script/appsscript.json','utf8'))"

      - name: Unit tests
        run: node --test
